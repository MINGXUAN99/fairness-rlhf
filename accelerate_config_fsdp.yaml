# Fully-Sharded Data Parallel across 4x RTX 5090 (32GB each), bf16.
# Use for FULL fine-tuning of a 4B backbone (--no_lora): parameters, gradients
# and optimizer states are sharded across the 4 GPUs (ZeRO-3 equivalent).
# LoRA does NOT need this — use accelerate_config_ddp.yaml instead.
#
# Launch:  accelerate launch --config_file accelerate_config_fsdp.yaml <script.py> --no_lora ...
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: FSDP
downcast_bf16: 'no'
gpu_ids: all
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 4
rdzv_backend: static
same_network: true
use_cpu: false
fsdp_config:
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_cpu_ram_efficient_loading: true
  fsdp_forward_prefetch: false
  fsdp_offload_params: false
  fsdp_sharding_strategy: FULL_SHARD
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_sync_module_states: true
  fsdp_use_orig_params: true
