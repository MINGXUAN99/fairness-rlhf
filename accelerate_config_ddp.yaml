# DistributedDataParallel across 4x RTX 5090 (32GB each), bf16.
# Recommended for LoRA PPO and reward-model training: each GPU holds a full
# (frozen bf16 base + LoRA) replica; only adapter/critic gradients are all-reduced.
#
# Launch:  accelerate launch --config_file accelerate_config_ddp.yaml <script.py> ...
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: MULTI_GPU
downcast_bf16: 'no'
gpu_ids: all
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 4
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
